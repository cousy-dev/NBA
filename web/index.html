<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>NBA 篮球经理</title>
<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btn-back" aria-label="返回">‹</button>
    <div id="step-wrap">
      <div id="step-label"></div>
      <div id="step-bar"><div id="step-fill"></div></div>
    </div>
    <div id="topbar-space"></div>
  </header>
  <main id="screens">
    <section id="screen-start" class="screen"></section>
    <section id="screen-team-select" class="screen hidden"></section>
    <section id="screen-create-info" class="screen hidden"></section>
    <section id="screen-budget" class="screen hidden"></section>
    <section id="screen-roster" class="screen hidden"></section>
    <section id="screen-summary" class="screen hidden"></section>
    <section id="screen-player" class="screen hidden"></section>
    <section id="screen-hub" class="screen hidden"></section>
    <section id="screen-match" class="screen hidden"></section>
    <section id="screen-standings" class="screen hidden"></section>
    <section id="screen-schedule" class="screen hidden"></section>
    <section id="screen-seasonend" class="screen hidden"></section>
    <section id="screen-regular-end" class="screen hidden"></section>
    <section id="screen-playoff" class="screen hidden"></section>
    <section id="screen-awards" class="screen hidden"></section>
    <section id="screen-trade" class="screen hidden"></section>
    <section id="screen-trade-deal" class="screen hidden"></section>
    <section id="screen-draft" class="screen hidden"></section>
    <section id="screen-draft-result" class="screen hidden"></section>
    <section id="screen-freeagent" class="screen hidden"></section>
  </main>
  <div id="toast" class="hidden"></div>
</div>
<noscript>需要启用 JavaScript 才能游玩</noscript>
<script src="data/teams.js?v=3"></script>
<script src="data/players_rated.js?v=3"></script>
<script src="js/engine.js?v=13"></script>
<script src="js/season.js?v=15"></script>
<script src="js/trade.js?v=3"></script>
<script src="js/draft.js?v=14"></script>
<!-- app.js 必须先于 freeagent.js 加载：freeagent.js 顶层有 RENDERERS.freeagent 赋值，依赖 app.js 定义的 RENDERERS 对象，否则整脚本加载即报错、rookieContractYears/decrementContracts 等函数全部未定义 -->
<script src="js/app.js?v=33"></script>
<script src="js/freeagent.js?v=5"></script>
</body>
</html>
