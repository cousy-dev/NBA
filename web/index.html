<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>NBA 篮球经理</title>
<link rel="stylesheet" href="css/style.css?v=95">
<!-- 虎扑 Shaper 技能使用声明（平台门禁校验：声明与实际调用必须一一对应） -->
<script type="application/json" id="colorbox-skill-usage">
{
  "skills": [
    "colorbox-storage-set-value",
    "colorbox-storage-get-value",
    "colorbox-cloud-request",
    "colorbox-social-share",
    "colorbox-track-report",
    "colorbox-auth-get-user-info",
    "user-feedback",
    "colorbox-oss-upload-file",
    "colorbox-request-bbs-open-post-editor",
    "colorbox-vatask",
    "colorbox-vatask-complete-reward-video",
    "colorbox-vatask-get-activity-task-state"
  ]
}
</script>
<!-- CloudBase 排行榜配置（部署 act-cloudbase 后回写；留空时自动降级为本地模式） -->
<script>
window.ACTIVITY_API_BASE = "";  // 部署后填: https://<域名>/api
window.ACTIVITY_ENV_ID = "";     // 部署后填: 腾讯云 EnvId
</script>
</head>
<body>

  <header id="topbar">

  <main id="screens">

    <section id="screen-player" class="screen hidden"></section>
    <section id="screen-hub" class="screen hidden"></section>
    <section id="screen-match" class="screen hidden"></section>
    <section id="screen-standings" class="screen hidden"></section>
    <section id="screen-schedule" class="screen hidden"></section>
    <section id="screen-seasonend" class="screen hidden"></section>
    <section id="screen-regular-end" class="screen hidden"></section>
    <section id="screen-playoff" class="screen hidden"></section>
    <section id="screen-awards" class="screen hidden"></section>

    <section id="screen-hof" class="screen hidden"></section>

    <section id="screen-allstar-game" class="screen hidden"></section>
    <section id="screen-threept" class="screen hidden"></section>
    <section id="screen-dunk" class="screen hidden"></section>
  </main>
  <div id="toast" class="hidden"></div>
</div>
<noscript>需要启用 JavaScript 才能游玩</noscript>
<script src="data/teams.js?v=3"></script>
